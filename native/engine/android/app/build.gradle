import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: 'com.android.application'

RES_PATH = RES_PATH.replace("\\", "/")
COCOS_ENGINE_PATH = COCOS_ENGINE_PATH.replace("\\", "/")

buildDir = "${RES_PATH}/proj/build/${project.name ==~ /^[_a-zA-Z0-9-]+$/ ? project.name : 'CocosGame'}"
// AUT-057: AdMob IDs are injected into the manifest at build time (never committed). Debug builds default to Google's public sample IDs;
// release builds default to empty strings (ads not configured -> x2 / Extended Overclock stay hidden). Override with -PADMOB_* or the ADMOB_* env vars.
def automataAdProperty = { String name, String fallback ->
    def fromProject = project.findProperty(name)
    def fromEnv = System.getenv(name)
    def value = (fromProject != null && fromProject.toString().trim()) ? fromProject.toString().trim() : ((fromEnv != null && fromEnv.trim()) ? fromEnv.trim() : fallback)
    return value
}

// AUT-073: release identity and signing. NOTHING secret is committed: the upload keystore path / passwords come ONLY from the environment
// (or -P properties as a fallback) and are never printed. The Cocos-generated gradle.properties may carry the Cocos DEBUG keystore as RELEASE_STORE_FILE;
// that one is rejected so a release can never be signed with it (an unsigned bundle/APK is produced instead and reported as such by tools/ci/build_android.js).
def automataSigningValue = { String name ->
    def fromEnv = System.getenv(name)
    if (fromEnv != null && fromEnv.length() > 0) return fromEnv
    def fromProject = project.findProperty(name)
    return fromProject != null ? fromProject.toString() : ''
}
def automataStoreFile = automataSigningValue('RELEASE_STORE_FILE')
def automataIsCocosDebugKeystore = automataStoreFile.replace("\\", "/").toLowerCase().endsWith('/keystore/debug.keystore') || automataSigningValue('RELEASE_KEY_ALIAS') == 'debug_keystore'
def automataReleaseSigned = !automataStoreFile.isEmpty() && !automataIsCocosDebugKeystore && file(automataStoreFile).isFile()
// versionCode = git commit count (tools/ci/build_android.js --release exports AUTOMATA_VERSION_CODE); debug builds keep 1.
def automataVersionCode = automataAdProperty('AUTOMATA_VERSION_CODE', '1').toInteger()
def automataVersionName = automataAdProperty('AUTOMATA_GAME_VERSION', '1.0')
logger.lifecycle("AUT-073 identity: applicationId=${APPLICATION_ID} versionCode=${automataVersionCode} versionName=${automataVersionName} releaseSigning=${automataReleaseSigned ? 'configured' : 'UNSIGNED'}")

android {
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    buildToolsVersion PROP_BUILD_TOOLS_VERSION
    ndkVersion PROP_NDK_VERSION
    namespace APPLICATION_ID

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId APPLICATION_ID
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode automataVersionCode
        versionName automataVersionName

        externalNativeBuild {
            cmake {
                targets "cocos"
                arguments "-DRES_DIR=${RES_PATH}", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
            }
            ndk { abiFilters PROP_APP_ABI.split(':') }
        }
    }

    sourceSets.main {
        java.srcDirs "../src", "src"
        res.srcDirs "../res", 'res', "${RES_PATH}/proj/res"
        jniLibs.srcDirs "../libs", 'libs'
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "${RES_PATH}/data"
        jniLibs {
            // Vulkan validation layer
            // srcDir "${android.ndkDirectory}/sources/third_party/vulkan/src/build-android/jniLibs"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging Boolean.parseBoolean(PROP_ENABLE_COMPRESS_SO)
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "../CMakeLists.txt"
            buildStagingDirectory "${RES_PATH}/proj/build"
        }
    }

    signingConfigs {

       release {
            if (automataReleaseSigned) {
                storeFile file(automataStoreFile)
                storePassword automataSigningValue('RELEASE_STORE_PASSWORD')
                keyAlias automataSigningValue('RELEASE_KEY_ALIAS')
                keyPassword automataSigningValue('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            manifestPlaceholders = [
                ADMOB_APP_ID: automataAdProperty('ADMOB_APP_ID', ''),
                ADMOB_UNIT_OFFLINE_DOUBLE: automataAdProperty('ADMOB_UNIT_OFFLINE_DOUBLE', ''),
                ADMOB_UNIT_EXTENDED_OVERCLOCK: automataAdProperty('ADMOB_UNIT_EXTENDED_OVERCLOCK', ''),
                USES_CLEARTEXT_TRAFFIC: 'false'
            ]
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (automataReleaseSigned) {
                signingConfig signingConfigs.release
            }
                        
            externalNativeBuild {
                cmake {
                    // switch HIDE_SYMBOLS to OFF to skip compilation flag `-fvisibility=hidden`
                    arguments "-DHIDE_SYMBOLS=ON"
                }
            }

            if (!Boolean.parseBoolean(PROP_IS_DEBUG)) {
                getIsDefault().set(true)
            }

        }

        debug {
            // Google public sample IDs only: the native provider also forces them whenever the app is debuggable.
            manifestPlaceholders = [
                ADMOB_APP_ID: 'ca-app-pub-3940256099942544~3347511713',
                ADMOB_UNIT_OFFLINE_DOUBLE: 'ca-app-pub-3940256099942544/5224354917',
                ADMOB_UNIT_EXTENDED_OVERCLOCK: 'ca-app-pub-3940256099942544/5224354917',
                USES_CLEARTEXT_TRAFFIC: 'true'
            ]
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            // resValue  "string", "app_name", "${PROP_APP_NAME}-dbg"
            // applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    implementation fileTree(dir: '../libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: "${COCOS_ENGINE_PATH}/cocos/platform/android/java/libs", include: ['*.jar'])
    implementation project(':libservice')
    implementation project(':libcocos')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    // AUT-065: Google User Messaging Platform, pinned to the version play-services-ads:25.4.0 already resolves (4.0.0, verified in the Gradle cache) so no second UMP version is pulled in.
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    if (Boolean.parseBoolean(PROP_ENABLE_INPUTSDK)) {
        implementation 'com.google.android.libraries.play.games:inputmapping:1.1.0-beta'
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.10"
    }
}
